<!DOCTYPE html>
<html>
<head>
  <title>Gallery</title>
  <link rel="stylesheet" href="color.css">

  <style>
    body {
      font-family: system-ui;
      background:url(paper.png);
      color:white;
      margin:0;
    }
    .filters {
      display:flex;
      gap:10px;
      padding:90px 20px 20px;
      flex-wrap:wrap;
    }

    select, input {
      padding:8px;
      border-radius:8px;
      border:none;
    }

    /* Masonry layout */
    .grid {
      column-count: 3;
      column-gap: 15px;
      padding:20px;
    }

    @media (max-width:900px) {
      .grid { column-count: 2; }
    }

    @media (max-width:500px) {
      .grid { column-count: 1; }
    }

    .card {
      position:relative;
      margin-bottom:15px;
      break-inside: avoid;
      overflow:hidden;
      border-radius:12px;
    }

    /* Natural image proportions */
    .card img {
      width:100%;
      height:auto;
      display:block;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    /* Overlay */
    .overlay {
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      color:white;
      opacity:0;
      transition: opacity 0.3s ease;
      padding:12px;
      display:flex;
      flex-direction:column;
      /* justify-content:flex-end; */
      z-index: 100000;
    }

    .card:hover .overlay {
      opacity:1;
    }

    .title {
      font-weight:800;
      margin-bottom:4px;
    }

    .meta {
      font-size:12px;
      opacity:0.7;
    }

    .text {
      font-size:13px;
      margin-top:6px;
    }

    .station {
      font-size:12px;
      color:#bbb;
      margin-top:6px;
    }
  </style>
</head>

<body>

  <nav>

    <a href="map.html">
      <div class="logo-small">
        <img src="logo.png" alt="">
      </div>
    </a>
  
    <!-- Desktop nav -->
    <div class="nav-links">
      <a href="map.html">Maps & Stories</a>
      <a href="writings.html">Writings</a>
      <a href="share.html">Share your story</a>
    </div>
  
    <!-- Hamburger -->
    <button class="menu-toggle" id="menuToggle">
      ☰
    </button>
  
    <!-- Mobile dropdown -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="map.html">Maps & Stories</a>
      <a href="writings.html">Writings</a>
      <a href="share.html">Share your story</a>
    </div>
  
  </nav>
  

<!-- Filters -->
<div class="filters">
  <input type="text" id="search" placeholder="Search title">

  <select id="stationFilter">
    <option value="">All Stations</option>
  </select>

  <select id="timeFilter">
    <option value="">Any Time</option>
    <option value="morning">Morning</option>
    <option value="afternoon">Afternoon</option>
    <option value="evening">Evening</option>
    <option value="night">Night</option>
  </select>
</div>

<!-- Gallery -->
<div id="gallery" class="grid"></div>

<script src="stories.js"></script>

<script>
const gallery = document.getElementById('gallery');
const searchInput = document.getElementById('search');
const stationFilter = document.getElementById('stationFilter');
const timeFilter = document.getElementById('timeFilter');

const stories = window.STORIES || [];

/* Populate station dropdown */
const stations = [...new Set(stories.map(s => s.stationName))];
stations.forEach(station => {
  const option = document.createElement('option');
  option.value = station;
  option.textContent = station;
  stationFilter.appendChild(option);
});

/* Get time category */
function getTimeOfDay(dateString) {
  const hour = new Date(dateString).getHours();

  if (hour >= 5 && hour < 12) return "morning";
  if (hour >= 12 && hour < 17) return "afternoon";
  if (hour >= 17 && hour < 21) return "evening";
  return "night";
}

/* Render gallery */
function renderGallery() {
  const search = searchInput.value.toLowerCase();
  const station = stationFilter.value;
  const time = timeFilter.value;

  const filtered = stories.filter(story => {
    const matchesSearch = story.title.toLowerCase().includes(search);
    const matchesStation = !station || story.stationName === station;
    const matchesTime = !time || getTimeOfDay(story.date) === time;

    return matchesSearch && matchesStation && matchesTime;
  });

  gallery.innerHTML = filtered.map(story => `
    <div class="card">
      <img src="${story.image}" alt="">
      
      <div class="overlay">
        <div class="title">${story.title}</div>
        <div class="meta">${story.date}</div>
        <div class="text">${story.text}</div>
        <div class="station">📍 ${story.stationName}</div>
      </div>

    </div>
  `).join('');
}

/* Event listeners */
searchInput.addEventListener('input', renderGallery);
stationFilter.addEventListener('change', renderGallery);
timeFilter.addEventListener('change', renderGallery);

/* Initial render */
renderGallery();

</script>

</body>
</html>
